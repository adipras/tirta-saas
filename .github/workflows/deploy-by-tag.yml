name: Deploy by tag

on:
  push:
    tags:
      - deploy-fe-*
      - deploy-be-*
      - deploy-all-*
  workflow_dispatch:
    inputs:
      target:
        description: Service target
        required: true
        type: choice
        options:
          - fe
          - be
          - all
      ref:
        description: Tag, branch, or commit SHA from main
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/tirta-saas-backend
  FRONTEND_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/tirta-saas-frontend

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.prepare.outputs.deploy_sha }}
      deploy_target: ${{ steps.prepare.outputs.deploy_target }}
      service_list: ${{ steps.prepare.outputs.service_list }}
      backend_image: ${{ steps.prepare.outputs.backend_image }}
      frontend_image: ${{ steps.prepare.outputs.frontend_image }}
      images_to_check: ${{ steps.prepare.outputs.images_to_check }}
      deploy_ref: ${{ steps.prepare.outputs.deploy_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve deploy target
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          BACKEND_IMAGE_REPO: ${{ env.BACKEND_IMAGE_REPO }}
          FRONTEND_IMAGE_REPO: ${{ env.FRONTEND_IMAGE_REPO }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main

          if [ "$EVENT_NAME" = "push" ]; then
            deploy_sha="$GITHUB_SHA"
            deploy_ref="$GITHUB_SHA"
            case "$REF_NAME" in
              deploy-fe-*)
                deploy_target="fe"
                service_list="frontend nginx"
                images_to_check="$FRONTEND_IMAGE_REPO"
                ;;
              deploy-be-*)
                deploy_target="be"
                service_list="backend"
                images_to_check="$BACKEND_IMAGE_REPO"
                ;;
              deploy-all-*)
                deploy_target="all"
                service_list="backend frontend nginx"
                images_to_check="$BACKEND_IMAGE_REPO,$FRONTEND_IMAGE_REPO"
                ;;
              *)
                echo "Unsupported tag: $REF_NAME" >&2
                exit 1
                ;;
            esac
          else
            deploy_target="$INPUT_TARGET"
            deploy_ref="${INPUT_REF:-main}"
            deploy_sha="$(git rev-parse "${deploy_ref}^{commit}")"
            case "$deploy_target" in
              fe)
                service_list="frontend nginx"
                images_to_check="$FRONTEND_IMAGE_REPO"
                ;;
              be)
                service_list="backend"
                images_to_check="$BACKEND_IMAGE_REPO"
                ;;
              all)
                service_list="backend frontend nginx"
                images_to_check="$BACKEND_IMAGE_REPO,$FRONTEND_IMAGE_REPO"
                ;;
              *)
                echo "Unsupported target: $deploy_target" >&2
                exit 1
                ;;
            esac
          fi

          if ! git merge-base --is-ancestor "$deploy_sha" origin/main; then
            echo "Tagged ref must point to a commit that exists on origin/main" >&2
            exit 1
          fi

          short_sha="$(git rev-parse --short "$deploy_sha")"

          {
            echo "deploy_sha=$deploy_sha"
            echo "deploy_target=$deploy_target"
            echo "service_list=$service_list"
            echo "backend_image=$BACKEND_IMAGE_REPO:sha-$short_sha"
            echo "frontend_image=$FRONTEND_IMAGE_REPO:sha-$short_sha"
            echo "images_to_check=$images_to_check"
            echo "deploy_ref=$deploy_ref"
          } >> "$GITHUB_OUTPUT"

  wait-for-images:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for image tags
        env:
          DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
          DEPLOY_TARGET: ${{ needs.prepare.outputs.deploy_target }}
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
        run: |
          set -euo pipefail

          case "$DEPLOY_TARGET" in
            fe)
              images=("$FRONTEND_IMAGE")
              ;;
            be)
              images=("$BACKEND_IMAGE")
              ;;
            all)
              images=("$BACKEND_IMAGE" "$FRONTEND_IMAGE")
              ;;
            *)
              echo "Unsupported target: $DEPLOY_TARGET" >&2
              exit 1
              ;;
          esac

          for image in "${images[@]}"; do
            echo "Waiting for $image"
            for attempt in $(seq 1 40); do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                echo "$image is available"
                break
              fi

              if [ "$attempt" -eq 40 ]; then
                echo "Image $image for commit $DEPLOY_SHA was not found in GHCR" >&2
                exit 1
              fi

              sleep 30
            done
          done

  deploy:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - wait-for-images
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DOMAIN_NAME: ${{ vars.RUNTIME_DOMAIN_NAME }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.RUNTIME_MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ vars.RUNTIME_MYSQL_DATABASE }}
      MYSQL_USER: ${{ vars.RUNTIME_MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.RUNTIME_MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.RUNTIME_JWT_SECRET }}
      AUTO_SEED_ADMIN: ${{ vars.RUNTIME_AUTO_SEED_ADMIN }}
      ENABLE_INVOICE_SCHEDULER: ${{ vars.RUNTIME_ENABLE_INVOICE_SCHEDULER }}
      ENABLE_TRIAL_SCHEDULER: ${{ vars.RUNTIME_ENABLE_TRIAL_SCHEDULER }}
      MYSQL_IMAGE: ${{ vars.RUNTIME_MYSQL_IMAGE }}
      NGINX_IMAGE: ${{ vars.RUNTIME_NGINX_IMAGE }}
      NETDATA_IMAGE: ${{ vars.RUNTIME_NETDATA_IMAGE }}
      NETDATA_HOSTNAME: ${{ vars.RUNTIME_NETDATA_HOSTNAME }}
    steps:
      - name: Checkout repository at deploy ref
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.deploy_ref }}

      - name: Configure SSH
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload runtime bundle
        run: |
          set -euo pipefail

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          tar -C deploy/runtime -czf - docker-compose.yml .env.example render-env.sh smoke-check.sh nginx | \
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C '$DEPLOY_PATH'"

      - name: Log server into GHCR
        if: ${{ env.GHCR_USERNAME != '' && env.GHCR_TOKEN != '' }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Render runtime env on server
        env:
          DEPLOY_TARGET: ${{ needs.prepare.outputs.deploy_target }}
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
        run: |
          set -euo pipefail

          encode() {
            printf '%s' "$1" | base64 -w 0
          }

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH_B64='$(encode "$DEPLOY_PATH")' DOMAIN_NAME_B64='$(encode "$DOMAIN_NAME")' MYSQL_ROOT_PASSWORD_B64='$(encode "$MYSQL_ROOT_PASSWORD")' MYSQL_DATABASE_B64='$(encode "$MYSQL_DATABASE")' MYSQL_USER_B64='$(encode "$MYSQL_USER")' MYSQL_PASSWORD_B64='$(encode "$MYSQL_PASSWORD")' JWT_SECRET_B64='$(encode "$JWT_SECRET")' AUTO_SEED_ADMIN_B64='$(encode "$AUTO_SEED_ADMIN")' ENABLE_INVOICE_SCHEDULER_B64='$(encode "$ENABLE_INVOICE_SCHEDULER")' ENABLE_TRIAL_SCHEDULER_B64='$(encode "$ENABLE_TRIAL_SCHEDULER")' BACKEND_IMAGE_B64='$(encode "$BACKEND_IMAGE")' FRONTEND_IMAGE_B64='$(encode "$FRONTEND_IMAGE")' MYSQL_IMAGE_B64='$(encode "$MYSQL_IMAGE")' NGINX_IMAGE_B64='$(encode "$NGINX_IMAGE")' NETDATA_IMAGE_B64='$(encode "$NETDATA_IMAGE")' NETDATA_HOSTNAME_B64='$(encode "$NETDATA_HOSTNAME")' bash -s" <<'EOF'
          set -euo pipefail

          decode() {
            printf '%s' "$1" | base64 -d
          }

          export DEPLOY_PATH="$(decode "$DEPLOY_PATH_B64")"
          export DOMAIN_NAME="$(decode "$DOMAIN_NAME_B64")"
          export MYSQL_ROOT_PASSWORD="$(decode "$MYSQL_ROOT_PASSWORD_B64")"
          export MYSQL_DATABASE="$(decode "$MYSQL_DATABASE_B64")"
          export MYSQL_USER="$(decode "$MYSQL_USER_B64")"
          export MYSQL_PASSWORD="$(decode "$MYSQL_PASSWORD_B64")"
          export JWT_SECRET="$(decode "$JWT_SECRET_B64")"
          export AUTO_SEED_ADMIN="$(decode "$AUTO_SEED_ADMIN_B64")"
          export ENABLE_INVOICE_SCHEDULER="$(decode "$ENABLE_INVOICE_SCHEDULER_B64")"
          export ENABLE_TRIAL_SCHEDULER="$(decode "$ENABLE_TRIAL_SCHEDULER_B64")"
          export BACKEND_IMAGE="$(decode "$BACKEND_IMAGE_B64")"
          export FRONTEND_IMAGE="$(decode "$FRONTEND_IMAGE_B64")"
          export MYSQL_IMAGE="$(decode "$MYSQL_IMAGE_B64")"
          export NGINX_IMAGE="$(decode "$NGINX_IMAGE_B64")"
          export NETDATA_IMAGE="$(decode "$NETDATA_IMAGE_B64")"
          export NETDATA_HOSTNAME="$(decode "$NETDATA_HOSTNAME_B64")"

          sh "$DEPLOY_PATH/render-env.sh"
          EOF

      - name: Deploy selected services
        env:
          DEPLOY_TARGET: ${{ needs.prepare.outputs.deploy_target }}
          SERVICE_LIST: ${{ needs.prepare.outputs.service_list }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose pull $SERVICE_LIST && docker compose up -d $SERVICE_LIST"

          echo "Deployed $DEPLOY_TARGET for commit $DEPLOY_SHA"

      - name: Run post-deploy smoke checks
        env:
          DEPLOY_TARGET: ${{ needs.prepare.outputs.deploy_target }}
        run: |
          set -euo pipefail

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DOMAIN_NAME='$DOMAIN_NAME' DEPLOY_TARGET='$DEPLOY_TARGET' sh '$DEPLOY_PATH/smoke-check.sh'"
