name: Bootstrap runtime server

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA from main
        required: true
        default: main
        type: string
      start_stack:
        description: Pull images and start the stack after bootstrap
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/tirta-saas-backend
  FRONTEND_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/tirta-saas-frontend

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DOMAIN_NAME: ${{ vars.RUNTIME_DOMAIN_NAME }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.RUNTIME_MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ vars.RUNTIME_MYSQL_DATABASE }}
      MYSQL_USER: ${{ vars.RUNTIME_MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.RUNTIME_MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.RUNTIME_JWT_SECRET }}
      AUTO_SEED_ADMIN: ${{ vars.RUNTIME_AUTO_SEED_ADMIN }}
      ENABLE_INVOICE_SCHEDULER: ${{ vars.RUNTIME_ENABLE_INVOICE_SCHEDULER }}
      ENABLE_TRIAL_SCHEDULER: ${{ vars.RUNTIME_ENABLE_TRIAL_SCHEDULER }}
      MYSQL_IMAGE: ${{ vars.RUNTIME_MYSQL_IMAGE }}
      NGINX_IMAGE: ${{ vars.RUNTIME_NGINX_IMAGE }}
      NETDATA_IMAGE: ${{ vars.RUNTIME_NETDATA_IMAGE }}
      NETDATA_HOSTNAME: ${{ vars.RUNTIME_NETDATA_HOSTNAME }}
      START_STACK: ${{ github.event.inputs.start_stack }}
      TARGET_REF: ${{ github.event.inputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image tags from ref
        run: |
          set -euo pipefail

          git fetch --no-tags origin main

          deploy_sha="$(git rev-parse "${TARGET_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$deploy_sha" origin/main; then
            echo "Bootstrap ref must point to a commit that exists on origin/main" >&2
            exit 1
          fi

          short_sha="$(git rev-parse --short "$deploy_sha")"

          {
            echo "DEPLOY_SHA=$deploy_sha"
            echo "BACKEND_IMAGE=$BACKEND_IMAGE_REPO:sha-$short_sha"
            echo "FRONTEND_IMAGE=$FRONTEND_IMAGE_REPO:sha-$short_sha"
          } >> "$GITHUB_ENV"

      - name: Wait for GHCR images
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GHCR images exist
        run: |
          set -euo pipefail

          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            echo "Waiting for $image"
            for attempt in $(seq 1 20); do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                echo "$image is available"
                break
              fi

              if [ "$attempt" -eq 20 ]; then
                echo "Image $image for commit $DEPLOY_SHA was not found in GHCR" >&2
                exit 1
              fi

              sleep 15
            done
          done

      - name: Configure SSH
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload runtime bundle
        run: |
          set -euo pipefail

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          tar -C deploy/runtime -czf - docker-compose.yml .env.example render-env.sh smoke-check.sh nginx | \
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C '$DEPLOY_PATH'"

      - name: Log server into GHCR
        if: ${{ env.GHCR_USERNAME != '' && env.GHCR_TOKEN != '' }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Render runtime env on server
        run: |
          set -euo pipefail

          encode() {
            printf '%s' "$1" | base64 -w 0
          }

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH_B64='$(encode "$DEPLOY_PATH")' DOMAIN_NAME_B64='$(encode "$DOMAIN_NAME")' MYSQL_ROOT_PASSWORD_B64='$(encode "$MYSQL_ROOT_PASSWORD")' MYSQL_DATABASE_B64='$(encode "$MYSQL_DATABASE")' MYSQL_USER_B64='$(encode "$MYSQL_USER")' MYSQL_PASSWORD_B64='$(encode "$MYSQL_PASSWORD")' JWT_SECRET_B64='$(encode "$JWT_SECRET")' AUTO_SEED_ADMIN_B64='$(encode "$AUTO_SEED_ADMIN")' ENABLE_INVOICE_SCHEDULER_B64='$(encode "$ENABLE_INVOICE_SCHEDULER")' ENABLE_TRIAL_SCHEDULER_B64='$(encode "$ENABLE_TRIAL_SCHEDULER")' BACKEND_IMAGE_B64='$(encode "$BACKEND_IMAGE")' FRONTEND_IMAGE_B64='$(encode "$FRONTEND_IMAGE")' MYSQL_IMAGE_B64='$(encode "$MYSQL_IMAGE")' NGINX_IMAGE_B64='$(encode "$NGINX_IMAGE")' NETDATA_IMAGE_B64='$(encode "$NETDATA_IMAGE")' NETDATA_HOSTNAME_B64='$(encode "$NETDATA_HOSTNAME")' bash -s" <<'EOF'
          set -euo pipefail

          decode() {
            printf '%s' "$1" | base64 -d
          }

          export DEPLOY_PATH="$(decode "$DEPLOY_PATH_B64")"
          export DOMAIN_NAME="$(decode "$DOMAIN_NAME_B64")"
          export MYSQL_ROOT_PASSWORD="$(decode "$MYSQL_ROOT_PASSWORD_B64")"
          export MYSQL_DATABASE="$(decode "$MYSQL_DATABASE_B64")"
          export MYSQL_USER="$(decode "$MYSQL_USER_B64")"
          export MYSQL_PASSWORD="$(decode "$MYSQL_PASSWORD_B64")"
          export JWT_SECRET="$(decode "$JWT_SECRET_B64")"
          export AUTO_SEED_ADMIN="$(decode "$AUTO_SEED_ADMIN_B64")"
          export ENABLE_INVOICE_SCHEDULER="$(decode "$ENABLE_INVOICE_SCHEDULER_B64")"
          export ENABLE_TRIAL_SCHEDULER="$(decode "$ENABLE_TRIAL_SCHEDULER_B64")"
          export BACKEND_IMAGE="$(decode "$BACKEND_IMAGE_B64")"
          export FRONTEND_IMAGE="$(decode "$FRONTEND_IMAGE_B64")"
          export MYSQL_IMAGE="$(decode "$MYSQL_IMAGE_B64")"
          export NGINX_IMAGE="$(decode "$NGINX_IMAGE_B64")"
          export NETDATA_IMAGE="$(decode "$NETDATA_IMAGE_B64")"
          export NETDATA_HOSTNAME="$(decode "$NETDATA_HOSTNAME_B64")"

          sh "$DEPLOY_PATH/render-env.sh"
          EOF

      - name: Start runtime stack
        if: ${{ env.START_STACK == 'true' }}
        run: |
          set -euo pipefail

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d"

      - name: Run post-bootstrap smoke checks
        if: ${{ env.START_STACK == 'true' }}
        run: |
          set -euo pipefail

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DOMAIN_NAME='$DOMAIN_NAME' DEPLOY_TARGET='all' sh '$DEPLOY_PATH/smoke-check.sh'"
